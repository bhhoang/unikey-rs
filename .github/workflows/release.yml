# On a version tag: build an AppImage on the oldest supported base (Ubuntu 24.04,
# GTK 4.14 / libadwaita 1.5) so it runs on that glibc and newer, then publish
# it as a GitHub release.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-4-dev libadwaita-1-dev libxkbcommon-dev libdbus-1-dev \
            libglib2.0-bin libgdk-pixbuf2.0-bin librsvg2-common file patchelf
      - name: Build
        run: cargo build --release --locked
      - name: Package
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          DEPLOY_GTK_VERSION: 4
          LINUXDEPLOY_OUTPUT_VERSION: ${{ github.ref_name }}
        run: |
          curl -sSLO https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -sSLO https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh
          PATH=$PWD:$PATH ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            -e target/release/unikey -e target/release/unikey-settings \
            -d packaging/unikey.desktop -i packaging/unikey.svg \
            --custom-apprun packaging/AppRun --plugin gtk --output appimage
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: unikey-*.AppImage
          generate_release_notes: true
